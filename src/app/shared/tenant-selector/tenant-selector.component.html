<mat-form-field class="login-field flex-align-center" appearance="fill" id="tenant-selector">
  <mat-label>{{ 'labels.inputs.Tenant' | translate }}*</mat-label>
  <input
    matInput
    [formControl]="tenantSelector"
    (input)="setTenantIdentifier()"
    class="tenantselector"
    [placeholder]="'labels.text.Enter Organisation Id' | translate"
  />
  <mifosx-m3-icon matIconPrefix name="domain"></mifosx-m3-icon>
</mat-form-field>
