name: Build and Push Docker Image

on:
  push:
    branches: [Release-1.11.0-preview-non-official]
  pull_request:
    branches: [Release-1.11.0-preview-non-official]

env:
  REGISTRY: docker.io
  IMAGE_NAME: hero78/racinepayfrontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history
          fetch-tags: true # Fetch all tags

      - name: Check Dockerfile
        run: |
          if [ -f "Dockerfile" ]; then
            echo "✅ Dockerfile found"
          else
            echo "❌ Dockerfile not found in root directory"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY_URL=https://registry.npmjs.org/
            BUILD_ENVIRONMENT_OPTIONS=--configuration production
            PUPPETEER_DOWNLOAD_HOST_ARG=https://storage.googleapis.com
            PUPPETEER_CHROMIUM_REVISION_ARG=1011831
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
