<mat-form-field class="tenant-field flex-align-center" id="tenant-selector">
  <span matPrefix class="m-r-10">
    <fa-icon icon="building" size="lg"></fa-icon>
  </span>
  <mat-label>{{ 'labels.inputs.Tenant' | translate }}*</mat-label>
  <input matInput [formControl]="tenantSelector" (input)="setTenantIdentifier()" class="tenantselector" [placeholder]="'labels.text.Enter Organisation Id' | translate"
  />
</mat-form-field>
