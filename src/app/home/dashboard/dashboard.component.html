<div class="container">
  <mat-tab-group #tabGroup (selectChange)="onTabChange($event)">
    <mat-tab label="Analytics Report">
      <mifosx-analytics-report></mifosx-analytics-report>
    </mat-tab>
    <mat-tab label="Client & Collection Trends">
      <ng-template matTabContent>
        <mat-card class="card">
          <mat-card-header>
            <mat-card-title></mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div fxLayout="row" class="top-card">
              <div class="trends-bar">
                <mifosx-client-trends-bar></mifosx-client-trends-bar>
              </div>
            </div>
  <mat-card class="card layout-column gap-40px">
    <div class="layout-row search">
      <mat-card-content>
        <mat-form-field>
          <mat-label>{{ 'labels.placeholders.Search Activity' | translate }}</mat-label>
          <input matInput [matAutocomplete]="activitySearch" [formControl]="searchText" />
        </mat-form-field>

        <mat-autocomplete #activitySearch="matAutocomplete">
          @for (activity of filteredActivities | async; track activity) {
            <mat-option [routerLink]="activity.path">
              <span>{{ activity.activity }}</span>
            </mat-option>
          }
        </mat-autocomplete>
      </mat-card-content>
    </div>

    <div class="layout-row top-card">
      <div class="trends-bar">
        <mifosx-client-trends-bar></mifosx-client-trends-bar>
      </div>
    </div>

            <div class="layout-row bottom-card">
              <div class="amount-disbursed">
                <mifosx-amount-disbursed-pie></mifosx-amount-disbursed-pie>
              </div>

              <div class="amount-collected">
                <mifosx-amount-collected-pie></mifosx-amount-collected-pie>
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
